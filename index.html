<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hub | LEGO Master Auditor</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --lego-red: #ff4b4b;
            --lego-blue: #3b82f6;
            --bg: #0f172a;
            --card: rgba(30, 41, 59, 0.7);
        }
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at top right, #1e293b, var(--bg));
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .container {
            text-align: center;
            background: var(--card);
            backdrop-filter: blur(15px);
            padding: 60px;
            border-radius: 32px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            max-width: 500px;
            width: 90%;
        }
        .logo {
            font-size: 3rem;
            font-weight: 800;
            margin-bottom: 10px;
            background: linear-gradient(to right, var(--lego-red), #ff7b7b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .version {
            font-family: monospace;
            background: rgba(59, 130, 246, 0.2);
            color: var(--lego-blue);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.9rem;
            display: inline-block;
            margin-bottom: 30px;
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .btn {
            text-decoration: none;
            padding: 18px 32px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 16px;
            transition: all 0.3s ease;
            display: block;
        }
        .btn-primary {
            background: var(--lego-red);
            color: white;
            box-shadow: 0 10px 20px -5px rgba(255, 75, 75, 0.4);
        }
        .btn-primary:hover {
            transform: translateY(-3px);
            background: #ff3333;
            box-shadow: 0 15px 30px -5px rgba(255, 75, 75, 0.6);
        }
        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: #94a3b8;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }
        .footer {
            margin-top: 40px;
            font-size: 0.8rem;
            color: #64748b;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">LEGO Auditor</div>
        <div class="version">v4.1.0</div>
        
        <div class="btn-group">
            <a href="http://localhost:8501" target="_blank" class="btn btn-primary">Launch Application</a>
            <a href="readme.html" class="btn btn-secondary">View Documentation</a>
        </div>

        <div class="footer">
            Designed for high-volume resellers<br>
            Developed by Kenneth Simons
        </div>
    </div>
</body>
</html>
